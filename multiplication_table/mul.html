<html>
    <head>
        <title>multiplication table</title>
        <link rel="stylesheet" href="mul.css">
        <script src="mul.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="contant">
            <p id="text">Calculate multiplication table </p>
            <div class="number">
                <input type="text" class="input" required id="num">
                <span >Enter The Number</span>
            </div>
            <div class="number">
                <input type="text" class="input" required id="range">
                <span>Enter The Range</span>
            </div>
            <input type="button" value="multiplication" onclick="mul()" id="btn">
            <p id="result"></p>
        </div>
    </body>
</html>
