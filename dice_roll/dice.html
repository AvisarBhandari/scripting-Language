<html>
    <head>
        <title>
            Dice 
        </title>
        <link rel="stylesheet" href="dice.css">
        <script src="dice.js"></script>
    </head>
    <body>
        <div id="container">
            <p>
                Guess the number Between 1 - 6
            </p>
            <input type="text" name="number" id="num">
            <br>
            <br>
            <input type="button" value="Roll dice" onclick="roll()">
        </div>
        <br>
        <div id="dice">
            <div id="one" class="child">1</div>
            <div id="two" class="child">2</div>
            <div id="three" class="child">3</div>
            <div id="four" class="child">4</div>
            <div id="five" class="child">5</div>
            <div id="six" class="child">6</div>
        </div>
    </body>
</html>
